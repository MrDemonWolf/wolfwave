<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>WolfWave</title>
    <style>
      /*
        Deliberately matches Stream Deck's native Property Inspector chrome
        rather than WolfWave's own design language: this panel is embedded in
        Elgato's window, where a WolfWave-branded panel would read as a
        misplaced dialog. Nothing is loaded from the network, so the panel works
        offline — unlike the sdpi-components library the official template pulls
        from a CDN.
      */
      :root {
        color-scheme: dark;
      }
      body {
        margin: 0;
        padding: 12px;
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
        font-size: 9pt;
        color: #d8d8d8;
        background: #2d2d2d;
      }
      .row {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 8px;
      }
      label {
        flex: 0 0 84px;
        text-align: right;
        color: #969696;
      }
      input {
        flex: 1 1 auto;
        min-width: 0;
        padding: 4px 6px;
        border: 1px solid #3d3d3d;
        border-radius: 4px;
        background: #1d1d1d;
        color: #d8d8d8;
        font: inherit;
      }
      input:focus {
        outline: none;
        border-color: #0a84ff;
      }
      input[aria-invalid="true"] {
        border-color: #ff453a;
      }
      .hint {
        margin: 2px 0 12px 92px;
        /* #969696 on #2d2d2d is 4.65:1 (AA body text). The dimmer #7a7a7a this
           started as measured 3.2:1, and this text carries the instructions for
           finding the access token — it has to stay readable. */
        color: #969696;
        line-height: 1.4;
      }
      .status {
        margin-left: 92px;
        min-height: 1.2em;
        font-weight: 600;
      }
      .status[data-ok="false"] {
        color: #ff453a;
      }
      .status[data-ok="true"] {
        color: #30d158;
      }
    </style>
  </head>
  <body>
    <div class="row">
      <label for="token">Access token</label>
      <input
        id="token"
        type="password"
        autocomplete="off"
        spellcheck="false"
        placeholder="64-character token"
      />
    </div>
    <p class="hint">
      In WolfWave: Settings &rarr; Stream Widgets &rarr; reveal and copy your
      access token.
    </p>

    <div class="row">
      <label for="host">Host</label>
      <input id="host" type="text" spellcheck="false" placeholder="127.0.0.1" />
    </div>
    <div class="row">
      <label for="port">Port</label>
      <input id="port" type="number" min="1" max="65535" placeholder="8765" />
    </div>
    <p class="hint">
      Leave these alone if the Stream Deck app runs on the same Mac as WolfWave.
    </p>

    <p class="status" id="status" role="status"></p>

    <script src="connection.js"></script>
  </body>
</html>
