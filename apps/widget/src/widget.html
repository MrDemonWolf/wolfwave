<!--
  Inlined Tailwind output. The build script generates this from src/widget.css
  by scanning widget.html + widget.ts for utility classes. Everything else

<style>%%TAILWIND_CSS%%</style>

<body>
<!--
  #root is the centered viewport. The widget itself slides into the middle.
  We start `#widget` with the `placeholder` class so the OBS scene never
  flashes blank during the initial WebSocket handshake.
-->
<div id="root">
  <div id="widget" class="placeholder">Waiting for music&hellip;</div>
</div>

<!--
  Opt-in (?queueTicker=1) upcoming-queue panel. Sibling of #root, not a
  child - #root flex-centers the now-playing card and this is independently
  positioned. Off by default: adding a second Browser Source with the flag
  is how a streamer opts in. See widget.ts buildQueueTicker().
-->
<div id="queue-ticker" class="hidden"></div>

<!--
  Design-system tokens (themes + layouts). Inlined to keep the widget a
  single self-contained file. Generated from design-system/tokens.json by
  design-system/scripts/generate.ts.
-->
<script>%%TOKENS_JS%%</script>

<!--
  Widget runtime. Compiled from src/widget.ts by ../build.ts. Read that file
  to understand state, transitions, message dispatch, etc. Every section is
  banner-commented for top-to-bottom reading.
-->
<script>%%WIDGET_JS%%</script>
