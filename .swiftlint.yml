# SwiftLint configuration for WolfWave
#
# Lenient to start: size rules emit warnings (never errors) and the CI lint
# job is non-blocking. Tighten over time; eventually run with `--strict` and
# drop `continue-on-error` from the CI job.
#
# Run locally with `make lint` (requires `brew install swiftlint`).

included:
  - apps/native/WolfWave
  - apps/native/WolfWaveTests

excluded:
  # Generated by design-system/scripts/generate.ts; never hand-edited.
  - apps/native/WolfWave/Core/DesignSystem/Tokens.generated.swift

opt_in_rules:
  # CLAUDE.md: "No force unwrapping; use optionals and guard."
  - force_unwrapping

disabled_rules:
  # TODOs are tracked elsewhere; don't flag them while ramping up.
  - todo

# Allow conventional short identifiers (coordinates, RGB, loop counters,
# notification capture, view-model abbrev). These read as well as the long
# form in their narrow context and are idiomatic across the codebase.
identifier_name:
  excluded:
    - a
    - b
    - d
    - g
    - h
    - i
    - ip
    - k
    - n
    - r
    - s
    - v
    - vm
    - w
    - x
    - y

# Size rules: warn generously, keep error thresholds high so they never block.
# WolfWave has a few large files (e.g. TwitchChatService) by design.
line_length:
  warning: 120
  error: 400
  ignores_comments: true
  ignores_urls: true

file_length:
  warning: 600
  error: 2500
  ignore_comment_only_lines: true

type_body_length:
  warning: 400
  error: 2500

function_body_length:
  warning: 80
  error: 400

# Raise complexity / parameter / tuple ceilings; error thresholds match the
# existing shape of the code (TwitchDeviceAuth, DiscordRPCService presence
# payload, WhatsNewView changelog entries). Warnings still surface so we can
# refactor over time without blocking CI today.
cyclomatic_complexity:
  warning: 15
  error: 30

function_parameter_count:
  warning: 6
  error: 12

large_tuple:
  warning: 3
  error: 5

custom_rules:
  # An Apple event addressed by bundle id is auto-launched by LaunchServices, so
  # this call *starts Music* when it isn't running. Checking "is it running?"
  # first does not help: the user can quit in the gap before the send. That race
  # shipped twice (PR #203, PR #273) as "WolfWave keeps reopening Music".
  # Resolve `MusicProcess.pid` and use `SBApplication(processIdentifier:)`.
  sb_application_bundle_identifier:
    name: "SBApplication addressed by bundle identifier"
    regex: 'SBApplication\(bundleIdentifier:'
    message: "Addressing a scripted app by bundle id auto-launches it. Use SBApplication(processIdentifier:) via MusicProcess.pid."
    # Code only. The comments and doc comments that explain this trap have to be
    # able to name the API they are warning about, and log messages quote it too.
    excluded_match_kinds:
      - comment
      - doccomment
      - doccomment.field
      - string
    severity: error

reporter: "xcode"
