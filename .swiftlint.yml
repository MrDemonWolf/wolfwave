# SwiftLint configuration for WolfWave
#
# CI blocks error-severity violations. Warning thresholds remain advisory while
# `swiftlint-baseline.json` records legacy debt; generous hard-error ceilings let
# existing large files be split incrementally without growing further.
#
# Run locally with `make lint` (requires Docker).

included:
  - apps/native/WolfWave
  - apps/native/WolfWaveTests

excluded:
  # Generated by design-system/scripts/generate.ts; never hand-edited.
  - apps/native/WolfWave/Core/DesignSystem/Tokens.generated.swift

opt_in_rules:
  # CLAUDE.md: "No force unwrapping; use optionals and guard."
  - force_unwrapping

disabled_rules:
  # TODOs are tracked elsewhere; don't flag them while ramping up.
  - todo

# Allow conventional short identifiers (coordinates, RGB, loop counters,
# notification capture, view-model abbrev). These read as well as the long
# form in their narrow context and are idiomatic across the codebase.
identifier_name:
  excluded:
    - a
    - b
    - d
    - g
    - h
    - i
    - ip
    - k
    - n
    - r
    - s
    - v
    - vm
    - w
    - x
    - y

# Size rules: warn generously, keep error thresholds high so they never block.
# WolfWave has a few large files (e.g. TwitchChatService) by design.
line_length:
  warning: 120
  error: 400
  ignores_comments: true
  ignores_urls: true

file_length:
  warning: 600
  error: 2500
  ignore_comment_only_lines: true

type_body_length:
  warning: 400
  error: 2500

function_body_length:
  warning: 80
  error: 400

# Raise complexity / parameter / tuple ceilings; error thresholds match the
# existing shape of the code (TwitchDeviceAuth, DiscordRPCService presence
# payload, WhatsNewView changelog entries). Warnings still surface so we can
# refactor over time without blocking CI today.
cyclomatic_complexity:
  warning: 15
  error: 30

function_parameter_count:
  warning: 6
  error: 12

large_tuple:
  warning: 3
  error: 5

custom_rules:
  # An Apple event addressed by bundle id is auto-launched by LaunchServices, so
  # this call *starts Music* when it isn't running. Checking "is it running?"
  # first does not help: the user can quit in the gap before the send. That race
  # shipped twice (PR #203, PR #273) as "WolfWave keeps reopening Music".
  # Resolve `MusicProcess.pid` and use `SBApplication(processIdentifier:)`.
  sb_application_bundle_identifier:
    name: "SBApplication addressed by bundle identifier"
    regex: 'SBApplication\(bundleIdentifier:'
    message: "Addressing a scripted app by bundle id auto-launches it. Use SBApplication(processIdentifier:) via MusicProcess.pid."
    # Code only. The comments and doc comments that explain this trap have to be
    # able to name the API they are warning about, and log messages quote it too.
    excluded_match_kinds:
      - comment
      - doccomment
      - doccomment.field
      - string
    severity: error

  # The unit test bundle is hosted: TEST_HOST is `WolfWave Dev.app`, so a test
  # process's `UserDefaults.standard` IS the dev app's live preference domain.
  # Tests writing settings there edited the developer's real app, and one such
  # write (`voteSkipWindowSeconds = 1`, not a valid picker tag) crashed the Song
  # Requests pane inside SwiftUI on the next launch. Production is routed the
  # same way so the rule can be a single repo-wide invariant.
  # Use `DefaultsStore.store`, or a throwaway `UserDefaults(suiteName:)` for a
  # SUT that takes an injected store.
  # The alternation matters. The first migration pass only rewrote
  # `UserDefaults.standard` and `= .standard`, so it silently skipped the
  # computed-property form `private static var defaults: UserDefaults
  # { .standard }` that `Preferences` and `FeatureFlags` both use. Tests then
  # wrote the isolated suite while the code under test still read the live
  # domain: no build error, no failed assertion, just reads returning defaults
  # and one vote-skip test deadlocking 512 tests into the run.
  user_defaults_standard:
    name: "Direct UserDefaults.standard"
    regex: 'UserDefaults\s*(\.standard\b|=\s*\.standard\b|\{\s*\.standard\b)'
    excluded:
      - ".*/Core/DefaultsStore\\.swift"
      - ".*/WolfWaveTests/DefaultsStoreTests\\.swift"
    message: "The hosted test bundle shares the live app's .standard domain. Route through DefaultsStore.store (or a private UserDefaults(suiteName:) in tests)."
    # Code only. The doc comments explaining this trap have to name the API.
    excluded_match_kinds:
      - comment
      - doccomment
      - doccomment.field
      - string
    severity: error

reporter: "xcode"
