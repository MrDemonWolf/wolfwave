name: Nightly

# Builds, signs, and notarizes WolfWave off `main` HEAD and publishes it to a
# single rolling prerelease (fixed tag `nightly`). The app's opt-in Nightly
# update channel points Sparkle at this release's `appcast-nightly.xml`.
#
# Stable releases (build_release.yml) are untouched: this is a separate feed,
# but both run the SAME shared plumbing — see the file map at the top of
# build_release.yml.
#
# Secrets: the signing/notarization/build secrets (DEVELOPER_ID_CERT_P12,
# DEVELOPER_ID_CERT_PASSWORD, APPLE_ID, APPLE_TEAM_ID, APPLE_APP_PASSWORD,
# SPARKLE_PRIVATE_KEY, TWITCH_CLIENT_ID, DISCORD_CLIENT_ID) are repo-level, so
# this workflow reads them directly. No GitHub environment is used: the cron
# must run unattended, and an environment would only add a manual-approval gate
# (the `release` env's purpose) without scoping any secret we need.

on:
  schedule:
    - cron: '0 8 * * *'   # daily 08:00 UTC
  workflow_dispatch:

permissions:
  contents: read

env:
  SCHEME: WolfWave
  PROJECT: apps/native/WolfWave.xcodeproj
  CONFIGURATION: Release
  NIGHTLY_TAG: nightly
  DMG_NAME: WolfWave-nightly.dmg

jobs:
  # Skip the build on a scheduled run when main hasn't moved since the last
  # nightly. A manual dispatch always builds. Forks never build: the cron would
  # otherwise fail daily on missing signing secrets.
  guard:
    name: Decide whether to build
    if: github.repository == 'MrDemonWolf/wolfwave'
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.decide.outputs.should_build }}
    steps:
      - name: Compare HEAD against last nightly
        id: decide
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT: ${{ github.event_name }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ]; then
            echo "Manual dispatch — building."
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          last="$(gh release view "$NIGHTLY_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --json assets,body 2>/dev/null \
            | jq -r '.body' | grep -oE 'built-from: [0-9a-f]{40}' | awk '{print $2}' || true)"
          echo "Last nightly sha: ${last:-none}"
          echo "Current HEAD sha: $HEAD_SHA"
          if [ "$last" = "$HEAD_SHA" ]; then
            echo "No new commits on main since last nightly — skipping."
            echo "should_build=false" >> "$GITHUB_OUTPUT"
          else
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          fi

  test:
    name: Run Tests
    needs: guard
    if: needs.guard.outputs.should_build == 'true'
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-native-build
        with:
          twitch-client-id: ${{ secrets.TWITCH_CLIENT_ID }}
          discord-client-id: ${{ secrets.DISCORD_CLIENT_ID }}

      - name: Run Tests
        env:
          MallocNanoZone: "0"
          WOLFWAVE_LOG_LEVEL: error
        run: make test-ci

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: NightlyTestResults
          path: TestResults.xcresult

  build-and-publish:
    name: Build & Publish Nightly
    needs: [guard, test]
    if: needs.guard.outputs.should_build == 'true'
    runs-on: macos-26
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history: scripts/version.sh derives the build number from the
          # commit count, and a shallow clone would report 1.
          fetch-depth: 0
          # This job has contents: write. Don't leave the checkout token in the
          # local git config where the build steps could read it; the release
          # commands take GH_TOKEN explicitly.
          persist-credentials: false

      - uses: ./.github/actions/setup-native-build
        with:
          twitch-client-id: ${{ secrets.TWITCH_CLIENT_ID }}
          discord-client-id: ${{ secrets.DISCORD_CLIENT_ID }}

      - name: Resolve nightly version
        id: version
        run: |
          # Single source of truth for both channels — see
          # docs/build-versioning-standard.md. Emits marketing / build /
          # short_sha / channel straight into $GITHUB_OUTPUT.
          RESOLVED=$(scripts/version.sh --channel nightly --format env)
          echo "$RESOLVED" >> "$GITHUB_OUTPUT"
          echo "$RESOLVED"

      - name: Import Developer ID certificate
        env:
          CERT_P12: ${{ secrets.DEVELOPER_ID_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.DEVELOPER_ID_CERT_PASSWORD }}
        run: bash scripts/import-signing-cert.sh

      - name: Build Release (arm64)
        env:
          NIGHTLY_VERSION: ${{ steps.version.outputs.marketing }}
          NIGHTLY_BUILD: ${{ steps.version.outputs.build }}
        run: |
          xcodebuild -project "$PROJECT" -scheme "$SCHEME" \
            -configuration "$CONFIGURATION" \
            -destination 'generic/platform=macOS' \
            ARCHS="arm64" \
            MARKETING_VERSION="$NIGHTLY_VERSION" \
            CURRENT_PROJECT_VERSION="$NIGHTLY_BUILD" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Developer ID Application" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            -clonedSourcePackagesDirPath SourcePackages \
            -derivedDataPath build build -quiet

      - name: Locate app bundle
        id: app
        run: |
          APP_PATH=$(xcodebuild -project "$PROJECT" -scheme "$SCHEME" \
            -configuration "$CONFIGURATION" -derivedDataPath build \
            -showBuildSettings 2>/dev/null \
            | awk -F'= ' '/CONFIGURATION_BUILD_DIR/ {dir=$2} /WRAPPER_NAME/ {name=$2} END {gsub(/^[ \t]+/,"",dir); gsub(/^[ \t]+/,"",name); print dir "/" name}')
          if [ ! -d "$APP_PATH" ]; then
            echo "App not found at $APP_PATH"; exit 1
          fi
          echo "path=$APP_PATH" >> "$GITHUB_OUTPUT"
          echo "App: $APP_PATH"

      - name: Code sign app bundle (inside-out)
        env:
          APP_PATH: ${{ steps.app.outputs.path }}
        run: bash scripts/codesign-app.sh "$APP_PATH"

      - name: Create DMG
        env:
          APP_PATH: ${{ steps.app.outputs.path }}
        run: scripts/create-dmg.sh "$APP_PATH" "$DMG_NAME" builds

      - name: Sign, notarize, and staple the DMG
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: bash scripts/notarize-dmg.sh "builds/$DMG_NAME"

      - name: Generate nightly release notes for Sparkle
        env:
          VERSION: ${{ steps.version.outputs.marketing }}
        run: |
          # Nightly notes are generic (no versioned CHANGELOG section exists), so
          # build the HTML directly. Named to match the DMG so generate_appcast
          # embeds it as the appcast <description>. Lists recent main commits.
          LOG=$(git log -10 --pretty='<li>%s</li>' HEAD)
          {
            printf '<h2>WolfWave Nightly</h2>'
            printf '<p>Automated build off <code>main</code> (%s). Unstable; for testing only. No support.</p>' "$VERSION"
            printf '<h3>Recent changes</h3><ul>%s</ul>' "$LOG"
          } > "builds/${DMG_NAME%.dmg}.html"
          ls -l "builds/${DMG_NAME%.dmg}.html"

      - name: Generate nightly appcast
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          # Dual-feed: a SEPARATE appcast file (no --channel flag). The fixed
          # `nightly` release tag makes the download URLs stable.
          bash scripts/generate-appcast.sh \
            builds/appcast-nightly.xml \
            "https://github.com/MrDemonWolf/wolfwave/releases/download/${NIGHTLY_TAG}/"

      - name: Publish to rolling nightly prerelease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.marketing }}
          SHORT_SHA: ${{ steps.version.outputs.short_sha }}
        run: |
          TITLE="WolfWave Nightly ($SHORT_SHA)"
          NOTES="$(printf 'Automated build off main. Unstable; for testing only.\n\nVersion: %s\nbuilt-from: %s' "$VERSION" "$GITHUB_SHA")"
          if gh release view "$NIGHTLY_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$NIGHTLY_TAG" --repo "$GITHUB_REPOSITORY" \
              --title "$TITLE" --notes "$NOTES" --prerelease
          else
            gh release create "$NIGHTLY_TAG" --repo "$GITHUB_REPOSITORY" \
              --title "$TITLE" --notes "$NOTES" --prerelease --target main
          fi
          # --clobber keeps the release (and its stable asset URLs) while
          # replacing the bytes. Never delete+recreate (would 404 the feed).
          gh release upload "$NIGHTLY_TAG" --repo "$GITHUB_REPOSITORY" \
            "builds/$DMG_NAME" "builds/appcast-nightly.xml" --clobber

      - name: Cleanup keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/build.keychain-db" 2>/dev/null || true
