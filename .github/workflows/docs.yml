name: Deploy Docs

on:
  push:
    branches: [main]
    # Swift-only pushes don't change the site, and a redeploy per commit just
    # burns Pages deployments. `workflow_dispatch` covers a forced redeploy.
    paths:
      - 'apps/docs/**'
      - 'design-system/**'
      - '.github/workflows/docs.yml'
      - 'package.json'
      - 'bun.lock'
      - 'turbo.json'
  workflow_dispatch:

permissions:
  contents: read

# Pages allows one in-flight deployment. Queue rather than cancel, so a run
# that already produced an artifact still publishes.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Cache bun dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
        id: pages

      - name: Install deps
        run: bun install --frozen-lockfile

      - name: Build docs
        env:
          NEXT_PUBLIC_COMMIT_SHA: ${{ github.sha }}
        run: bun run build --filter docs

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: apps/docs/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
