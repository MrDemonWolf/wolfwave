name: Deploy Docs

on:
  push:
    branches: [main]
    # Swift-only pushes don't change the site, and a redeploy per commit just
    # burns Pages deployments. `workflow_dispatch` covers a forced redeploy.
    paths:
      - 'apps/docs/**'
      - 'design-system/**'
      - '.github/workflows/docs.yml'
      - 'package.json'
      - 'bun.lock'
      - 'turbo.json'
  # Redeploy when a stable release is published, so release-derived content
  # (latest DMG link, star count, version) refreshes. A release run sits on the
  # tag ref, which the github-pages environment's branch policy (main only)
  # refuses, and it would build the tag's docs rather than main's. So the
  # release run only dispatches a fresh run on main (`redeploy-on-release`);
  # build and deploy never run for the release event itself.
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

# Pages allows one in-flight deployment. Queue rather than cancel, so a run
# that already produced an artifact still publishes.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  redeploy-on-release:
    # Prereleases (the rolling nightly) don't change the download links.
    if: github.event_name == 'release' && !github.event.release.prerelease
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Dispatch a docs deploy from main
        env:
          GH_TOKEN: ${{ github.token }}
        # workflow_dispatch is one of the events a GITHUB_TOKEN may trigger.
        run: gh workflow run docs.yml --ref main --repo "$GITHUB_REPOSITORY"

  build:
    if: github.event_name != 'release'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Full commit history (trees only, no blobs): sitemap.ts reads each
          # page's last-commit date with `git log -1 -- <file>`, and a shallow
          # clone would stamp every page with the deploy commit's date.
          fetch-depth: 0
          filter: blob:none

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Cache bun dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
        id: pages

      - name: Install deps
        run: bun install --frozen-lockfile

      - name: Build docs
        env:
          NEXT_PUBLIC_BASE_PATH: ""
          NEXT_PUBLIC_COMMIT_SHA: ${{ github.sha }}
        run: bun run build --filter docs

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: apps/docs/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
