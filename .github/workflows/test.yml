name: CI

on:
  push:
    branches: [main]
  # Every pull request, whatever it targets. Deliberately NOT `branches: [main]`:
  # that filter is on the BASE branch, so a stacked PR (one opened against
  # another PR's branch rather than main) matched nothing and ran zero native
  # jobs. It did not fail, it silently reported only the third-party checks,
  # which is the worst version of this: a PR that looks reviewed and is
  # completely untested. Push events below stay pinned to main.
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  SCHEME: WolfWave
  PROJECT: apps/native/WolfWave.xcodeproj

jobs:
  # One paths-filter pass for the whole workflow. Every other job gates on these
  # outputs at the JOB level, so a docs-only PR shows the native jobs as skipped
  # instead of running a job full of no-op steps. Required Checks verifies every
  # applicable job, because branch protection treats skipped jobs as passing.
  required-checks:
    name: Required Checks
    if: always()
    needs: [changes, test, ui-test, docs, streamdeck, lint, lint-crash-safety, lint-headers, lint-sync, ds-lint]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify applicable checks passed
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import sys

          needs = json.loads(os.environ["NEEDS_JSON"])
          if needs["changes"]["result"] != "success":
              sys.exit("Change detection failed; required checks cannot be determined.")
          flags = needs["changes"]["outputs"]
          jobs = {
              "test": "native", "ui-test": "native", "docs": "docs",
              "streamdeck": "streamdeck", "lint": "swiftlint",
              "lint-crash-safety": "swiftlint", "lint-headers": "headers",
              "lint-sync": "sync", "ds-lint": "ds",
          }
          failures = []
          for job, flag in jobs.items():
              expected = "success" if flags.get(flag) == "true" else "skipped"
              result = needs[job]["result"]
              if flags.get(flag) not in ("true", "false") or result != expected:
                  failures.append(f"{job}: {result} (expected {expected})")
          if failures:
              sys.exit("\n".join(failures))
          print("All applicable checks passed.")
          PY

  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      native: ${{ steps.filter.outputs.native }}
      docs: ${{ steps.filter.outputs.docs }}
      streamdeck: ${{ steps.filter.outputs.streamdeck }}
      ds: ${{ steps.filter.outputs.ds }}
      headers: ${{ steps.filter.outputs.headers }}
      sync: ${{ steps.filter.outputs.sync }}
      swiftlint: ${{ steps.filter.outputs.swiftlint }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false

      - id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            native:
              - 'apps/native/**'
              - 'apps/widget/**'
              - 'design-system/tokens.json'
              - 'design-system/scripts/generate.ts'
              - '.github/FUNDING.yml'
              - 'scripts/generate-sponsor-config.sh'
              - 'scripts/generate-app-icons.ts'
              - 'scripts/check-generated-drift.sh'
              # The script that decides whether the test run passed. Without
              # this, editing the gate skips the very job it gates.
              - 'scripts/check-test-results.sh'
              - '.github/actions/setup-native-build/**'
              - '.github/workflows/test.yml'
              - 'package.json'
              - 'bun.lock'
              - 'turbo.json'
              - 'Makefile'
            docs:
              - 'apps/docs/**'
              - 'design-system/tokens.json'
              - 'design-system/scripts/generate.ts'
              - 'package.json'
              - 'bun.lock'
              - 'turbo.json'
              - '.github/workflows/test.yml'
            streamdeck:
              - 'apps/streamdeck/**'
              # The icon generator reads the brand mark from here, and the job's
              # icon-drift step exists to catch exactly that drift.
              - 'assets/logo-mono.svg'
              - '.github/workflows/test.yml'
              - 'apps/native/WolfWave/Services/WebSocket/StreamDeckCommand.swift'
              - 'apps/native/WolfWave/Core/AppConstants.swift'
              - 'apps/native/WolfWave/Services/WebSocket/WebSocketAuthToken.swift'
              - 'bun.lock'
            ds:
              - 'apps/native/WolfWave/Views/**'
              - 'design-system/scripts/lint.ts'
              - 'design-system/scripts/lint.test.ts'
              - 'design-system/lint-allowlist.txt'
              - 'design-system/scripts/validate-tokens.ts'
              - 'design-system/tokens.json'
              - 'design-system/tokens.schema.json'
              - 'package.json'
              - 'bun.lock'
              - '.github/workflows/test.yml'
            headers:
              - 'apps/native/**'
              - 'scripts/check-headers.mjs'
              - '.github/workflows/test.yml'
            # Every input scripts/check-sync.mjs and the lint-sync test files
            # read. A path missing here skips the gate for exactly the PR that
            # needs it.
            sync:
              # The duplicate-token-list scan walks every Swift source.
              - 'apps/native/WolfWave/**'
              - 'design-system/components/**'
              - 'design-system/scripts/generate.ts'
              - 'design-system/scripts/lint.ts'
              - 'design-system/tokens.json'
              # The doc-port check scans every docs page and native doc.
              - 'apps/docs/content/docs/**'
              - 'apps/native/docs/**'
              # The landing-protocol check reads these two.
              - 'apps/docs/app/(home)/page.tsx'
              - 'apps/docs/app/(home)/DeveloperTabs.tsx'
              # The bug-report check matches BugReportURL.FormField (under
              # apps/native/WolfWave above) against this form's field ids.
              - '.github/ISSUE_TEMPLATE/bug_report.yml'
              # release-notes.test.mjs renders the real CHANGELOG's newest
              # section; a malformed entry must fail here, not mid-release.
              - 'CHANGELOG.md'
              - 'README.md'
              - 'CONTRIBUTING.md'
              - 'CLAUDE.md'
              - 'scripts/check-sync.mjs'
              - 'scripts/check-sync.test.mjs'
              - 'scripts/release-notes.mjs'
              - 'scripts/release-notes.test.mjs'
              - 'scripts/version.sh'
              - 'scripts/version.test.mjs'
              - 'Makefile'
              - '.github/workflows/test.yml'
            swiftlint:
              - 'apps/native/**'
              - '.swiftlint.yml'
              - '.swiftlint-crash-safety.yml'
              - 'swiftlint-baseline.json'
              - 'Makefile'
              - '.github/workflows/test.yml'

  test:
    name: Build & Test
    needs: changes
    if: needs.changes.outputs.native == 'true'
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Select latest stable Xcode
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: latest-stable

      # Also regenerates widget.html, the design tokens, and SponsorConfig,
      # which is what the drift gate below inspects.
      - uses: ./.github/actions/setup-native-build

      - name: Verify generated artifacts are in sync with their sources
        run: bash scripts/check-generated-drift.sh

      # The OBS widget's own suite (render, escaping, payload hardening,
      # reconnect). Bun is already installed by setup-native-build, and the
      # native filter covers apps/widget/**, so a widget change runs it.
      - name: Widget tests
        run: bun run --filter widget test

      - name: Build & Test
        env:
          # Disable the nano malloc zone in the test host. The Swift runtime +
          # nano allocator on the macos-26 runner image historically aborted the
          # xctest host with `malloc: pointer being freed was not allocated` at
          # process launch. That runner bug is fixed; this stays as cheap
          # insurance against a regression (as does serial testing in the
          # Makefile target).
          MallocNanoZone: "0"
          # Silence routine OSLog chatter so the captured output isn't flooded
          # with thousands of log lines per suite. Errors still surface, and the
          # file sink is untouched, so LoggerTests keeps asserting on on-disk
          # content.
          WOLFWAVE_LOG_LEVEL: error
        run: make test-ci

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: TestResults
          path: TestResults.xcresult

  # Early warning for compiler and SDK changes. This deliberately does not
  # gate stable PR or release workflows until the signal proves reliable.
  xcode-compatibility:
    name: Xcode Compatibility (informational)
    needs: changes
    if: needs.changes.outputs.native == 'true'
    continue-on-error: true
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Select newest available Xcode
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: latest

      - name: Report selected toolchain
        run: |
          xcodebuild -version
          swift --version

      - uses: ./.github/actions/setup-native-build

      - name: Compatibility build
        run: make build

  # XCUITests, on their own job and their own scheme. Deliberately NOT folded
  # into `test`: this one launches the real app and drives its windows, so it is
  # minutes rather than seconds and fails for a different class of reason. The
  # release and nightly workflows call `make test-ci`, which is unit-only, so a
  # UI run never gates a release.
  #
  # The app isolates itself the moment the runner launches it: `UITestMode`
  # routes UserDefaults and the Keychain to throwaway storage and keeps Music,
  # Twitch, Discord, and Sparkle down, so this job needs no account, no network,
  # and never raises the Automation prompt.
  ui-test:
    name: UI Tests
    needs: changes
    if: needs.changes.outputs.native == 'true'
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Select latest stable Xcode
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: latest-stable

      - uses: ./.github/actions/setup-native-build

      - name: UI Tests
        env:
          MallocNanoZone: "0"
          WOLFWAVE_LOG_LEVEL: error
          # Keeps the screenshot matrix from SettingsUITests.testCapturesEveryPane
          # so a layout change can be reviewed without running the suite locally.
          UI_RESULT_BUNDLE: UITestResults.xcresult
        run: make test-ui UI_RESULT_BUNDLE="$UI_RESULT_BUNDLE"

      - name: Upload UI Test Results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: UITestResults
          path: UITestResults.xcresult
          retention-days: 7
          if-no-files-found: ignore

  docs:
    name: Docs Build
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Cache bun dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-

      - name: Install deps
        run: bun install --frozen-lockfile

      - name: Type check
        run: bun run --filter docs types:check

      - name: Lint
        run: bun run --filter docs lint

      - name: Build docs
        run: bunx turbo build --filter docs

      # Unit tests plus the SEO guard (lib/seo.test.ts), which reads the built
      # `out/`, so it must run after the build. It fails under CI if `out/` is
      # missing rather than skipping.
      - name: Test docs
        run: bun run --filter docs test

  streamdeck:
    name: Stream Deck Plugin
    needs: changes
    if: needs.changes.outputs.streamdeck == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Cache bun dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-

      - name: Install deps
        run: bun install --frozen-lockfile

      - name: Type check
        run: bun run --filter streamdeck typecheck

      - name: Test
        run: bun run --filter streamdeck test

      # Packaging validates the manifest and every asset it points at, which is
      # the only automated check that the icons and the bundle are shippable.
      - name: Package
        run: bun run --filter streamdeck pack

      - name: Verify committed icons match the generator
        run: |
          bun run --filter streamdeck icons
          if ! git diff --exit-code -- apps/streamdeck/com.mrdemonwolf.wolfwave.sdPlugin/imgs apps/streamdeck/marketing; then
            echo "::error::Stream Deck icons are out of sync with scripts/generate-icons.ts. Run \`bun run --filter streamdeck icons\` and commit the result."
            exit 1
          fi

  lint:
    name: SwiftLint
    needs: changes
    if: needs.changes.outputs.swiftlint == 'true'
    # Runs on Linux via the official SwiftLint container; no need to burn a
    # 10x-billed macOS runner just to lint. SwiftLint is platform-agnostic, and
    # the Makefile pins the official image by immutable digest so local and CI
    # path mapping, rules, and baseline interpretation stay identical.
    #
    # BLOCKING for error-severity violations. The committed baseline records
    # legacy warning debt and should only shrink (regenerate intentionally with
    # `make lint-baseline`). Advisory warnings still surface in the log.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run SwiftLint
        run: make lint

  lint-crash-safety:
    name: SwiftLint (crash-safety, blocking)
    needs: changes
    if: needs.changes.outputs.swiftlint == 'true'
    # BLOCKING gate for the three crash-class rules (force unwrap / try! / as!)
    # on production source. Runs with --strict, so a regression fails the PR.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run crash-safety SwiftLint
        run: make lint-crash-safety

  lint-headers:
    name: Swift file headers (blocking)
    needs: changes
    if: needs.changes.outputs.headers == 'true'
    # BLOCKING gate that every Swift file carries the canonical Xcode header
    # from IDETemplateMacros.plist, with a Created-by date matching the file's
    # git creation date.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history: the check resolves each file's creation date with
          # `git log --diff-filter=A --follow`, which a shallow clone can't
          # answer. The script degrades to a shape-only check when it detects
          # one, so a shallow checkout here would silently weaken the gate.
          fetch-depth: 0
          persist-credentials: false

      # Pin Node instead of using whatever the runner image ships. These
      # scripts only need node:test and fs, but `ubuntu-latest` moves to the
      # Ubuntu 26 image (rolling out 2026-10-19 to 2026-11-19), and an image
      # change should never be what flips a blocking gate.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Check Swift file headers
        run: make lint-headers

  lint-sync:
    name: Source and docs sync (blocking)
    needs: changes
    if: needs.changes.outputs.sync == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Pin Node instead of using whatever the runner image ships. These
      # scripts only need node:test and fs, but `ubuntu-latest` moves to the
      # Ubuntu 26 image (rolling out 2026-10-19 to 2026-11-19), and an image
      # change should never be what flips a blocking gate.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Check source and documentation sync
        run: make lint-sync

  ds-lint:
    name: Design-system lint
    needs: changes
    if: needs.changes.outputs.ds == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Cache bun dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-

      # ds:lint is dependency-free, but ds:schema needs ajv.
      - name: Install deps
        run: bun install --frozen-lockfile

      # The lint rules are regexes over Swift source, so a rule that silently
      # stops matching looks exactly like a clean tree. These pin the patterns
      # against known-good and known-bad lines.
      - name: Test design-system lint rules
        run: bun run ds:test

      - name: Run design-system lint
        run: bun run ds:lint

      # tokens.json drives the generated platform outputs and generate.ts does
      # not check shape before emitting, so a typo'd namespace would reach the
      # Swift app, the docs CSS, the widget, and the landing-page previews at once.
      - name: Validate tokens.json against its schema
        run: bun run ds:schema
