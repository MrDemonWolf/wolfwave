name: Release

# Builds, signs, notarizes, and drafts a GitHub Release on a `v*` tag push.
#
# Shared plumbing lives outside this file so Nightly runs the exact same code:
#   .github/actions/setup-native-build   Bun, generated assets, Config.xcconfig
#   scripts/import-signing-cert.sh       Developer ID cert -> temp keychain
#   scripts/codesign-app.sh              inside-out app signing
#   scripts/notarize-dmg.sh              sign + notarize + staple the DMG
#   scripts/generate-appcast.sh          Sparkle appcast + validation
#   scripts/version.sh                   marketing version + build number

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Skip release creation
        type: boolean
        required: false
        default: false
  push:
    tags:
      - 'v*'

permissions:
  contents: read

env:
  SCHEME: WolfWave
  PROJECT: apps/native/WolfWave.xcodeproj
  CONFIGURATION: Release

jobs:
  test:
    name: Run Tests
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-native-build
        with:
          twitch-client-id: ${{ secrets.TWITCH_CLIENT_ID }}
          discord-client-id: ${{ secrets.DISCORD_CLIENT_ID }}

      - name: Run Tests
        env:
          MallocNanoZone: "0"
          WOLFWAVE_LOG_LEVEL: error
        run: make test-ci

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ReleaseTestResults
          path: TestResults.xcresult

  build-and-release:
    needs: test
    runs-on: macos-26
    # `release` environment requires Nathanial's manual approval before any
    # step runs and scopes signing/notarization secrets to this job only.
    # See repo Settings → Environments.
    environment: release
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history: scripts/version.sh derives the build number from the
          # commit count, and a shallow clone would report 1.
          fetch-depth: 0
          # This job has contents: write. Don't leave the checkout token in the
          # local git config where the build steps could read it; the release
          # commands take GH_TOKEN explicitly.
          persist-credentials: false

      - uses: ./.github/actions/setup-native-build
        with:
          twitch-client-id: ${{ secrets.TWITCH_CLIENT_ID }}
          discord-client-id: ${{ secrets.DISCORD_CLIENT_ID }}

      - name: Resolve version
        id: version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Single source of truth, shared with nightly.yml — see
          # docs/build-versioning-standard.md. Stable and nightly draw from the
          # SAME build-number counter so neither channel can strand the other.
          RESOLVED=$(scripts/version.sh --format env)
          echo "$RESOLVED" >> "$GITHUB_OUTPUT"
          VERSION=$(echo "$RESOLVED" | sed -n 's/^marketing=//p')
          if [ -z "$VERSION" ]; then
            echo "::error::scripts/version.sh returned no marketing version"
            exit 1
          fi

          # A v* tag is authoritative for the shipped version, but it must agree
          # with the committed MARKETING_VERSION — a mismatch means the release
          # checklist bump was missed, and the tag would silently ship a
          # different number than the project claims.
          PROJECT_VERSION=$(xcodebuild -project "$PROJECT" -scheme "$SCHEME" \
            -configuration "$CONFIGURATION" -showBuildSettings 2>/dev/null \
            | awk -F'= ' '/MARKETING_VERSION/ {gsub(/^[ \t]+/,"",$2); print $2; exit}')
          if [ -z "$PROJECT_VERSION" ]; then
            echo "::error::Could not resolve MARKETING_VERSION from the app project"
            exit 1
          fi
          if [[ "$GITHUB_REF" == refs/tags/v* ]] && [ "$VERSION" != "$PROJECT_VERSION" ]; then
            echo "::error::Release tag v$VERSION does not match app MARKETING_VERSION $PROJECT_VERSION"
            exit 1
          fi

          # Stable MUST outrank the newest nightly. Sharing one counter makes
          # that true whenever the release commit is later than the last
          # nightly's — but a tag placed on the exact commit a nightly was built
          # from resolves to the SAME count, and Sparkle would then never offer
          # this release to nightly testers. Compare counts (not the published
          # build numbers) so the retired timestamp-numbered nightly can't
          # block every future release.
          BUILD=$(echo "$RESOLVED" | sed -n 's/^build=//p')
          NIGHTLY_SHA=$(gh release view nightly --repo "$GITHUB_REPOSITORY" \
            --json body --jq '.body' 2>/dev/null \
            | grep -oE 'built-from: [0-9a-f]{40}' | awk '{print $2}' || true)
          if [ -n "${NIGHTLY_SHA:-}" ] && git cat-file -e "${NIGHTLY_SHA}^{commit}" 2>/dev/null; then
            NIGHTLY_BUILD=$(git rev-list --count "$NIGHTLY_SHA")
            echo "Latest nightly built from $NIGHTLY_SHA (build $NIGHTLY_BUILD); this release is build $BUILD"
            if [ "$BUILD" -le "$NIGHTLY_BUILD" ]; then
              echo "::error::Release build $BUILD does not exceed the latest nightly build $NIGHTLY_BUILD."
              echo "::error::Tag a commit after the last nightly (the CHANGELOG/version bump commit is enough)."
              exit 1
            fi
          else
            echo "No resolvable nightly built-from sha; skipping the nightly-ordering check."
          fi

          echo "dmg_name=WolfWave-${VERSION}.dmg" >> "$GITHUB_OUTPUT"
          echo "$RESOLVED"

      - name: Import Developer ID certificate
        env:
          CERT_P12: ${{ secrets.DEVELOPER_ID_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.DEVELOPER_ID_CERT_PASSWORD }}
        run: bash scripts/import-signing-cert.sh

      - name: Build Release (arm64)
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.marketing }}
          RELEASE_BUILD: ${{ steps.version.outputs.build }}
        run: |
          # Both values are injected, never read from the committed pbxproj:
          # MARKETING_VERSION so a v* tag is authoritative over whatever is
          # checked in, and CURRENT_PROJECT_VERSION so stable shares the single
          # monotonic counter with nightly (Sparkle never offers a lower build).
          xcodebuild -project "$PROJECT" -scheme "$SCHEME" \
            -configuration "$CONFIGURATION" \
            -destination 'generic/platform=macOS' \
            ARCHS="arm64" \
            MARKETING_VERSION="$RELEASE_VERSION" \
            CURRENT_PROJECT_VERSION="$RELEASE_BUILD" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Developer ID Application" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            -clonedSourcePackagesDirPath SourcePackages \
            -derivedDataPath build build -quiet

      - name: Locate app bundle
        id: app
        env:
          VERSION: ${{ steps.version.outputs.marketing }}
        run: |
          APP_PATH=$(xcodebuild -project "$PROJECT" -scheme "$SCHEME" \
            -configuration "$CONFIGURATION" -derivedDataPath build \
            -showBuildSettings 2>/dev/null \
            | awk -F'= ' '/CONFIGURATION_BUILD_DIR/ {dir=$2} /WRAPPER_NAME/ {name=$2} END {gsub(/^[ \t]+/,"",dir); gsub(/^[ \t]+/,"",name); print dir "/" name}')
          if [ ! -d "$APP_PATH" ]; then
            echo "App not found at $APP_PATH"; exit 1
          fi
          APP_VERSION=$(/usr/libexec/PlistBuddy \
            -c "Print :CFBundleShortVersionString" \
            "$APP_PATH/Contents/Info.plist" 2>/dev/null || true)
          if [ "$APP_VERSION" != "$VERSION" ]; then
            echo "::error::Built app version ${APP_VERSION:-missing} does not match release version $VERSION"
            exit 1
          fi
          echo "path=$APP_PATH" >> "$GITHUB_OUTPUT"
          echo "App: $APP_PATH (version $APP_VERSION)"

      - name: Code sign app bundle (inside-out)
        env:
          APP_PATH: ${{ steps.app.outputs.path }}
          PROVISIONING_PROFILE_B64: ${{ secrets.PROVISIONING_PROFILE_B64 }}
        run: bash scripts/codesign-app.sh "$APP_PATH"

      - name: Create DMG
        env:
          DMG_NAME: ${{ steps.version.outputs.dmg_name }}
          APP_PATH: ${{ steps.app.outputs.path }}
        run: scripts/create-dmg.sh "$APP_PATH" "$DMG_NAME" builds

      - name: Sign, notarize, and staple the DMG
        env:
          DMG_NAME: ${{ steps.version.outputs.dmg_name }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: bash scripts/notarize-dmg.sh "builds/$DMG_NAME"

      - name: Generate release notes for Sparkle
        env:
          DMG_NAME: ${{ steps.version.outputs.dmg_name }}
          VERSION: ${{ steps.version.outputs.marketing }}
        run: |
          # Render this version's CHANGELOG section to an HTML file named to
          # match the DMG (WolfWave-X.Y.Z.html next to WolfWave-X.Y.Z.dmg).
          # generate_appcast picks up the matching-name HTML and embeds it
          # inline as the appcast <description>, so Sparkle renders the notes
          # in-dialog. The "Developer" section is dropped and the notes footer
          # links to the full web changelog. See scripts/release-notes.mjs.
          bun scripts/release-notes.mjs "$VERSION" "builds/${DMG_NAME%.dmg}.html"
          ls -l "builds/${DMG_NAME%.dmg}.html"

      - name: Generate Sparkle appcast
        env:
          VERSION: ${{ steps.version.outputs.marketing }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          bash scripts/generate-appcast.sh \
            builds/appcast.xml \
            "https://github.com/MrDemonWolf/wolfwave/releases/download/v${VERSION}/"

      - name: Upload DMG artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.version.outputs.dmg_name }}
          path: builds/${{ steps.version.outputs.dmg_name }}

      - name: Create or update draft GitHub Release
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.marketing }}
          DMG_NAME: ${{ steps.version.outputs.dmg_name }}
        run: |
          # Release notes are embedded inline in appcast.xml, so the appcast is
          # self-contained and the .html no longer needs to ship as a release
          # asset. Uploading only the DMG + appcast avoids re-introducing the
          # download-instead-of-render bug (a linked GitHub asset is served as
          # an attachment).
          TAG="v$VERSION"
          if is_draft="$(gh release view "$TAG" --json isDraft --jq '.isDraft' 2>/dev/null)"; then
            if [ "$is_draft" != "true" ]; then
              echo "::error::Release $TAG is already published; refusing to replace it"
              exit 1
            fi

            gh release edit "$TAG" --title "WolfWave v$VERSION"
            gh release upload "$TAG" "builds/$DMG_NAME" "builds/appcast.xml" --clobber
          else
            gh release create "$TAG" \
              "builds/$DMG_NAME" "builds/appcast.xml" \
              --title "WolfWave v$VERSION" \
              --generate-notes --draft
          fi

      - name: Cleanup keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/build.keychain-db" 2>/dev/null || true
