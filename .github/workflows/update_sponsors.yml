name: Update Sponsors

on:
  schedule:
    # Daily at 00:00 UTC
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: update-sponsors
  cancel-in-progress: false

jobs:
  update-sponsors:
    # Forks have no SPONSORKIT_TOKEN, so the cron would just fail daily.
    if: github.repository == 'MrDemonWolf/wolfwave'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check SponsorKit configuration
        id: sponsorkit
        env:
          SPONSORKIT_GITHUB_TOKEN: ${{ secrets.SPONSORKIT_TOKEN }}
        run: |
          if [[ -n "$SPONSORKIT_GITHUB_TOKEN" ]]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Sponsor refresh skipped: SPONSORKIT_TOKEN is not configured."
            echo "Sponsor refresh skipped because SPONSORKIT_TOKEN is not configured." >> "$GITHUB_STEP_SUMMARY"
          fi

      # Generation has no persisted checkout credential; only the final step
      # receives the token used to push the generated SVG.
      - name: Checkout
        if: steps.sponsorkit.outputs.available == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Bun
        if: steps.sponsorkit.outputs.available == 'true'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.11

      - name: Install pinned dependencies
        if: steps.sponsorkit.outputs.available == 'true'
        run: bun install --frozen-lockfile

      - name: Generate sponsors SVG
        if: steps.sponsorkit.outputs.available == 'true'
        env:
          SPONSORKIT_GITHUB_TOKEN: ${{ secrets.SPONSORKIT_TOKEN }}
        run: bun run sponsorkit

      - name: Commit and push if changed
        if: steps.sponsorkit.outputs.available == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/docs/public/sponsors.svg
          if git diff --staged --quiet; then
            echo "No sponsor changes."
            exit 0
          fi
          git commit -m "chore(docs): update sponsors SVG"
          gh auth setup-git
          git push
