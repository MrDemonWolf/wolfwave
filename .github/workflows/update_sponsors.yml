name: Update Sponsors

on:
  schedule:
    # Daily at 00:00 UTC
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: update-sponsors
  cancel-in-progress: false

jobs:
  update-sponsors:
    # Forks have no SPONSORKIT_TOKEN, so the cron would just fail daily.
    if: github.repository == 'MrDemonWolf/wolfwave'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      # Generation has no persisted checkout credential; only the final step
      # receives the repository token used to open the generated update PR.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.11

      - name: Install pinned dependencies
        run: bun install --frozen-lockfile

      - name: Generate sponsors SVG
        env:
          SPONSORKIT_GITHUB_TOKEN: ${{ secrets.SPONSORKIT_TOKEN }}
        run: bun run sponsorkit

      - name: Create sponsor update pull request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          add-paths: apps/docs/public/sponsors.svg
          commit-message: "chore(docs): update sponsors SVG"
          title: "chore(docs): update sponsors SVG"
          body: "Update the generated sponsors SVG."
          branch: chore/update-sponsors
          delete-branch: true
