version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(actions)"
    labels:
      - dependencies
      - github-actions
    groups:
      actions-minor-and-patch:
        update-types:
          - minor
          - patch

  # SwiftPM dependencies of the native app (Sparkle). There is no Package.swift:
  # since 2026-03-31 Dependabot discovers the Package.resolved inside the
  # .xcodeproj bundle and reads version rules from project.pbxproj
  # (github.blog/changelog/2026-03-31-dependabot-now-supports-xcode-projects-
  # using-swiftpm-with-xcodeproj-manifests), so point it at the app folder.
  - package-ecosystem: swift
    directory: /apps/native
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(swift)"
    labels:
      - dependencies
      - swift
    groups:
      swift-minor-and-patch:
        update-types:
          - minor
          - patch

  # JS workspace dependencies (bun.lock at the repo root covers every workspace).
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    labels:
      - dependencies
      - javascript
    # The Stream Deck plugin runs on the Node version pinned in its
    # manifest.json ("Nodejs": { "Version": "20" }), so its @types/node must
    # track that runtime, not the newest Node. This block covers every
    # workspace (one root bun.lock), so the ignore applies repo-wide: bump
    # @types/node majors by hand, moving the plugin's manifest and types together.
    ignore:
      - dependency-name: "@types/node"
        update-types:
          - version-update:semver-major
    groups:
      bun-minor-and-patch:
        update-types:
          - minor
          - patch
